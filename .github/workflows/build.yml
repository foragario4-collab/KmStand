name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK bauen
        run: gradle assembleRelease --no-daemon
      - name: APK umbenennen
        run: mv app/build/outputs/apk/release/app-release.apk Km-Stand.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Km-Stand-APK
          path: Km-Stand.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Km-Stand Version ${{ github.run_number }}
          files: Km-Stand.apk
